<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WebOS</title>
<style>
:root{--acc:#3b82f6;--wb:rgba(16,20,30,.52);--wf:#f1f3f7;--wc:rgba(255,255,255,.1);--bd:rgba(255,255,255,.2);--ico:60px;--in:inset 1.5px 1.5px 1px rgba(255,255,255,.5),inset -1px -1px 1px rgba(255,255,255,.16),inset 0 0 34px rgba(255,255,255,.07)}
body.light{--wb:rgba(250,251,255,.55);--wf:#12151b;--wc:rgba(255,255,255,.5);--bd:rgba(255,255,255,.55)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:14px;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none}
svg{display:block}
.hide{display:none!important}
.glass,.win{backdrop-filter:blur(24px) saturate(200%) brightness(1.1);-webkit-backdrop-filter:blur(24px) saturate(200%) brightness(1.1);border:1px solid rgba(255,255,255,.26);box-shadow:var(--in),0 12px 40px rgba(0,0,0,.28)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.06) 60%,rgba(255,255,255,.14))}
.glass::after,.win::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;background:radial-gradient(200px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.24),transparent 65%)}
#screen{position:fixed;inset:0;height:100dvh;overflow:hidden;background:var(--wall);background-size:140% 140%;animation:fl 50s ease-in-out infinite alternate}
#screen.photo{background-size:cover;background-position:center;animation:none}
@keyframes fl{from{background-position:0 0}to{background-position:100% 100%}}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:300}
/* top bar */
#status{position:absolute;top:0;left:0;right:0;height:32px;padding:env(safe-area-inset-top) 16px 0;box-sizing:content-box;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;z-index:95;letter-spacing:.2px}
body.pc #status{background:rgba(10,14,22,.3);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--bd);padding-top:0;height:32px}
#sl{display:flex;gap:14px;align-items:center}
#sr{display:flex;gap:12px;align-items:center;cursor:pointer}
body:not(.pc) .pc-o,body.pc .mb-o{display:none}
/* lock */
#lock{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;padding-top:16vh;background:rgba(5,8,15,.25);backdrop-filter:blur(6px);touch-action:none;cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#lock.up{transform:translateY(-105%)}
#lock .d{font-size:17px;font-weight:500;opacity:.85}
#lock .t{font-size:clamp(72px,20vw,120px);font-weight:200;letter-spacing:-2px;line-height:1.05}
#lock .h{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));font-size:13px;opacity:.7;letter-spacing:.5px}
/* home */
#home{position:absolute;inset:calc(32px + env(safe-area-inset-top)) 0 0;padding:14px 18px 150px;overflow:auto;transition:.35s}
#home.back{transform:scale(.95);filter:blur(5px);opacity:.6}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;max-width:560px}
body.pc .wgs{display:none}
.wg{position:relative;border-radius:22px;padding:16px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;opacity:.95;overflow:hidden;color:#fff}
.wg b{font-size:30px;font-weight:300;letter-spacing:-1px}
.wg small{opacity:.65;text-transform:uppercase;letter-spacing:1px;font-size:10px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 4px;justify-items:center}
body.tablet #grid{grid-template-columns:repeat(6,1fr);--ico:68px}
body.phone #grid{--ico:60px}
@media (orientation:landscape) and (max-height:600px){body.phone #grid{grid-template-columns:repeat(8,1fr)}}
body.pc #grid{--ico:52px;grid-auto-flow:column;grid-template-columns:none;grid-template-rows:repeat(auto-fill,98px);justify-content:start;gap:8px 14px;height:calc(100% - 20px)}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:12px;width:84px;text-shadow:0 1px 6px #000a;position:relative}
.ico{position:relative;width:var(--ico);height:var(--ico);border-radius:26%;display:grid;place-items:center;color:#fff;box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 2px rgba(255,255,255,.2),0 6px 18px rgba(0,0,0,.35);transition:transform .15s}
.ico::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.42),transparent 50%);pointer-events:none}
.ico svg{position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.app:active .ico{transform:scale(.9)}
body.pc .app:hover .ico{transform:translateY(-3px)}
#dock{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:14px;padding:10px 14px;border-radius:26px;z-index:20}
body.pc #dock{gap:10px;padding:8px 12px;border-radius:18px}
#dock .app{width:auto}
#dock .app.run::after{content:"";position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:#fff}
#sp{position:absolute;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:20px;font-size:13px;cursor:pointer;z-index:20;display:flex;gap:8px;align-items:center;opacity:.9}
body.pc #sp{display:none}
/* windows */
.win{position:absolute;background:var(--wb);color:var(--wf);display:flex;flex-direction:column;overflow:hidden;animation:wo .22s cubic-bezier(.2,.9,.25,1);border:1px solid var(--bd)}
.win.min{display:none}.win.closing{opacity:0;transform:scale(.96);transition:.18s}
@keyframes wo{from{opacity:0;transform:scale(.94)}}
body.phone .win{inset:calc(32px + env(safe-area-inset-top)) 0 0 0!important;width:auto!important;height:auto!important;border-radius:20px 20px 0 0}
body.tablet .win,body.pc .win{border-radius:20px;box-shadow:var(--in),0 24px 70px rgba(0,0,0,.5)}
.win.act{box-shadow:var(--in),0 30px 90px rgba(0,0,0,.6)}
.win.max{inset:32px 0 0!important;width:auto!important;height:auto!important;border-radius:0}
.bar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;background:var(--wc);font-weight:600;font-size:13px;cursor:default;touch-action:none}
.ttl{display:flex;gap:9px;align-items:center}
.ctl{display:flex;gap:4px}
.ctl button{background:none;border:0;color:var(--wf);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;opacity:.75}
.ctl button:hover{background:rgba(128,128,128,.25);opacity:1}
.ctl .cl:hover{background:#e5484d;color:#fff}
body.phone .mn,body.phone .mx{display:none}
.body{flex:1;overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;user-select:text;-webkit-user-select:text}
#nav{position:absolute;bottom:calc(5px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:#fffd;z-index:99;cursor:pointer;outline:14px solid transparent}
body.pc #nav{display:none}
/* control center */
#cc{position:absolute;top:calc(40px + env(safe-area-inset-top));right:12px;width:min(340px,calc(100% - 24px));padding:16px;border-radius:20px;z-index:97;transform:translateY(-20px);opacity:0;pointer-events:none;transition:.25s;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
body.pc #cc{top:38px}
#cc.open{transform:none;opacity:1;pointer-events:auto}
.tile{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.09);border:0;color:#fff}
.tile.on{background:var(--acc)}
#cc .sl{grid-column:1/5;display:flex;gap:12px;align-items:center;opacity:.9}
#cc input{flex:1;accent-color:var(--acc)}
/* spotlight */
#spot{position:absolute;inset:0;z-index:96;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);padding:12vh 16px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
#spot>*{width:min(520px,100%)}
#spot input{padding:15px 18px;border-radius:14px;border:1px solid var(--bd);font-size:16px;outline:none;background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(28px) saturate(180%);user-select:text}
.res{position:relative;padding:11px 14px;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:center;margin-bottom:6px}
.res:hover{background:var(--acc)}
#toast{position:absolute;top:calc(40px + env(safe-area-inset-top));left:50%;width:calc(100% - 24px);max-width:360px;transform:translate(-50%,-180%);padding:12px 16px;border-radius:16px;z-index:98;transition:.4s cubic-bezier(.2,.9,.25,1);font-size:13px}
#toast.show{transform:translate(-50%,0)}
/* app ui */
textarea{flex:1;width:100%;min-height:180px;background:var(--wc);color:var(--wf);border:0;border-radius:12px;padding:14px;font:15px/1.5 system-ui;resize:none;outline:none;user-select:text}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;max-width:380px;margin:0 auto;width:100%}
.calc .scr{grid-column:1/5;padding:10px 6px;text-align:right;font-size:40px;min-height:76px;overflow:hidden;word-break:break-all;font-weight:300}
.calc button,.btn{background:var(--wc);color:var(--wf);border:0;border-radius:12px;font-size:19px;padding:13px;cursor:pointer;font-family:inherit;transition:.1s}
.btn{font-size:14px;font-weight:600;padding:10px 16px}
.calc button.op,.btn.p{background:var(--acc);color:#fff}
.calc button:active,.btn:active{filter:brightness(1.3);transform:scale(.97)}
canvas{background:#fff;border-radius:12px;width:100%;flex:1;touch-action:none;min-height:200px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.sw{width:38px;height:38px;border-radius:10px;border:2px solid var(--bd);cursor:pointer}
.sw:hover{outline:2px solid var(--acc)}
.big{font-size:44px;text-align:center;font-weight:200;margin:10px 0;letter-spacing:-1px}
.keys{display:flex;flex:1;gap:3px;min-height:200px;max-width:560px;margin:0 auto;width:100%}
.keys div{flex:1;background:#f4f5f7;color:#222;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:12px;cursor:pointer}
.keys div:active{background:var(--acc);color:#fff}
#tout{flex:1;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:#9be29b;background:#0b0e13;border-radius:10px;padding:12px;overflow:auto;min-height:160px;user-select:text}
#tin{background:#0b0e13;color:#9be29b;border:0;border-radius:10px;padding:11px 12px;font:13px ui-monospace,Menlo,monospace;outline:none;margin-top:8px;user-select:text}
.dp{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin-top:10px}
.in{flex:1;min-width:0;background:var(--wc);color:var(--wf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;font:14px inherit;outline:none;user-select:text;-webkit-user-select:text}
.card2{background:var(--wc);border-radius:14px;padding:12px 14px;margin:6px 0}
#boot{position:fixed;inset:0;background:#000;z-index:999;display:grid;place-items:center;transition:opacity .7s;color:#fff}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
h3{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.6;font-weight:600}
</style>
</head>
<body>
<div id="boot"><div style="text-align:center;letter-spacing:7px;font-weight:200;font-size:22px">WEBOS<div style="width:120px;height:2px;background:rgba(255,255,255,.18);margin:18px auto 0;overflow:hidden;border-radius:2px"><i style="display:block;height:100%;width:40%;background:#fff;animation:ld 1s infinite"></i></div></div></div>
<div id="screen">
 <div id="status">
  <div id="sl"><span class="mb-o" id="stime"></span><b class="pc-o">WebOS</b><span class="pc-o" id="app" style="font-weight:400;opacity:.7"></span></div>
  <div id="sr"><span id="si"></span><span class="pc-o" id="ptime"></span></div>
 </div>
 <div id="home">
  <div class="wgs">
   <div class="wg glass"><small id="wd"></small><b id="wt1"></b><span>Aujourd'hui</span></div>
   <div class="wg glass"><small>Notes</small><span id="wn" style="opacity:.85;line-height:1.4"></span><span id="wbat">Batterie</span></div>
  </div>
  <div id="grid"></div>
 </div>
 <div id="sp" class="glass"></div>
 <div id="dock" class="glass"></div>
 <div id="cc" class="glass"></div>
 <div id="spot" class="hide"></div>
 <div id="toast" class="glass"></div>
 <div id="lock"><div class="d" id="ld"></div><div class="t" id="lt"></div><div class="h">Glisse vers le haut pour ouvrir</div></div>
 <div id="dim"></div>
 <div id="nav"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const St={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const P={
 notes:'M6 3h9l4 4v14H6z M14 3v5h5 M9 13h6 M9 17h6',

const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;

 {n:'Cerise',v:mesh(['#3b0520','#9d174d'],[[250,300,260,'#fb7185'],[800,300,250,'#f472b6'],[500,800,300,'#e11d48'],[850,850,200,'#f59e0b']],'#fda4af')},
 {n:'Minuit',v:mesh(['#05070f','#111a33'],[[300,300,260,'#1e3a8a'],[750,700,300,'#312e81'],[850,200,180,'#0ea5e9']],'#3b82f6')}
];
let photo='';
const ACCS=['#3b82f6','#ec4899','#10b981','#f59e0b','#8b5cf6'];
const APPS=[
 {id:'browser',n:'Navigateur',i:'globe',c:'#3b82c4,#27659d',f:browser},

/* device detection */
function detect(){
 const touch=matchMedia('(pointer:coarse)').matches&&!matchMedia('(hover:hover)').matches;
 const short=Math.min(innerWidth,innerHeight);
 const d=touch?(short<600?'phone':'tablet'):(innerWidth<700?'phone':'pc');
 if(d!==dev){dev=d;document.body.className=(St.get('light','0')=='1'?'light ':'')+d;build()}
}
addEventListener('resize',detect);addEventListener('orientationchange',detect);

function applyLook(){
 const i=+St.get('wall',0),ph=photo||St.get('wallc','');

 $('#screen').style.setProperty('--wall',i==-1&&ph?`url(${ph})`:(WALLS[i]||WALLS[0]).v);
 document.documentElement.style.setProperty('--acc',St.get('acc',ACCS[0]));

}

 }

/* lock (touch devices only) */
const L=$('#lock');let y0=null;

L.onpointerup=e=>{const dy=e.clientY-y0;y0=null;L.style.transition='';L.style.transform='';if(dy<-60||Math.abs(dy)<6)unlock()};

function tick(){

function beep(f,d=.4){
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
 o.type='triangle';o.frequency.value=f;g.gain.value=.3*vol;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
 o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}
}

 const q=s=>b.querySelector(s),f=()=>{const s=ms/1000;return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};

function draw(b){

 const cv=b.querySelector('canvas'),x=cv.getContext('2d');let col='#111',dn=false;
 ['#111','#e5484d','#3b82f6','#10b981','#f59e0b','#8b5cf6'].forEach(c=>{const d=document.createElement('div');d.className='sw';d.style.background=c;d.onclick=()=>col=c;b.querySelector('.cl').appendChild(d)});

 const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{dn=true;const[a,c]=p(e);x.beginPath();x.moveTo(a,c)};

function snake(b,w){

 const x=b.querySelector('canvas').getContext('2d'),M={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},sc$=b.querySelector('.sc');

 const go=k=>{const n=M[k];if(n[0]!=-d[0]||n[1]!=-d[1])d=n};
 b.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>go(e.dataset.d));
 const kd=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m&&w.el.classList.contains('act')){go(m);e.preventDefault()}};

const DB=()=>new Promise((ok,ko)=>{const r=indexedDB.open('webos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=ko});

function files(b){
 b.innerHTML='<div class="row"><button class="btn p up">Importer</button><button class="btn nt">Enregistrer mes notes</button></div><div class="ls"></div><div class="pv" style="margin-top:10px"></div>';

function mic(b,w){
 b.innerHTML='<div class="big rt">00:00</div><div class="row" style="justify-content:center"><button class="btn p rc">Enregistrer</button></div><div class="ls"></div>';

  try{st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);ch=[];mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=()=>{fin();const ty=mr.mimeType||'audio/webm',bl=new Blob(ch,{type:ty}),a=document.createElement('audio');rc.textContent='Enregistrer';
